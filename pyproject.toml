[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isovita"
version = "0.1.0"
description = "Interpretable detection of temporal variation in isoform composition"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniel Chen"}]
keywords = ["isoform", "transcriptomics", "compositional data", "permutation inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.11",
  "patsy>=0.5.6",
  "statsmodels>=0.14",
  "isoplex>=0.1.0,<0.2",
]

[project.optional-dependencies]
adata = ["anndata>=0.10,<0.12"]
notebook = ["matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29", "jupyterlab>=4"]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.9", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29", "matplotlib>=3.8", "PyYAML>=6", "anndata>=0.10,<0.12"]

[project.scripts]
isovita-prepare = "isovita.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: optional higher-permutation regression checks"]
filterwarnings = ["ignore:.*permutation resolution may be coarse for BH.*:RuntimeWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"src/isovita/__init__.py" = ["F401"]
